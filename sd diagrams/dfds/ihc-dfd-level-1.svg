<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #16283a; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #516579; }
      .external { fill: #eef5fb; stroke: #4f82ad; stroke-width: 2; }
      .process { fill: #edf7ef; stroke: #559166; stroke-width: 2.5; }
      .store { fill: #fff8e9; stroke: #bd8a35; stroke-width: 2.5; }
      .label { font-size: 19px; font-weight: 700; }
      .body { font-size: 15px; fill: #3d5266; }
      .flow { stroke: #426986; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .flowLabel { font-size: 14px; font-weight: 700; fill: #426986; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426986"/></marker>
  </defs>
  <rect width="1600" height="980" fill="#fff"/>
  <text x="65" y="60" class="title">DFD Level 1 — IHC Monitoring and Alert System</text>
  <text x="65" y="90" class="subtitle">Internal data flow for the Raspberry Pi 3 application</text>

  <rect x="65" y="365" width="230" height="125" rx="14" class="external"/>
  <text x="105" y="415" class="label">ESP32 Nodes</text>
  <text x="93" y="445" class="body">Sensor readings</text>

  <rect x="390" y="150" width="260" height="120" rx="16" class="process"/>
  <text x="465" y="195" class="label">1.0 Receive and</text>
  <text x="455" y="220" class="label">Validate Readings</text>

  <rect x="770" y="150" width="260" height="120" rx="16" class="process"/>
  <text x="845" y="195" class="label">2.0 Store</text>
  <text x="815" y="220" class="label">Monitoring Data</text>

  <rect x="770" y="500" width="260" height="120" rx="16" class="process"/>
  <text x="825" y="545" class="label">3.0 Evaluate</text>
  <text x="830" y="570" class="label">Alert Rules</text>

  <rect x="1160" y="150" width="300" height="130" rx="15" class="store"/>
  <text x="1245" y="200" class="label">D1 Local SQLite</text>
  <text x="1225" y="230" class="body">Devices, readings, rules,</text>
  <text x="1225" y="253" class="body">alerts, and roster data</text>

  <rect x="1160" y="500" width="260" height="120" rx="16" class="process"/>
  <text x="1210" y="545" class="label">4.0 Present Status</text>
  <text x="1225" y="570" class="label">and Alerts</text>

  <rect x="65" y="720" width="230" height="125" rx="14" class="external"/>
  <text x="120" y="770" class="label">Authorised Admin</text>
  <text x="104" y="800" class="body">Approved roster/rule updates</text>

  <rect x="1390" y="720" width="145" height="125" rx="14" class="external"/>
  <text x="1425" y="770" class="label">Staff</text>
  <text x="1410" y="800" class="body">Status and alerts</text>

  <path d="M295 420 L390 220" class="flow"/>
  <text x="285" y="310" class="flowLabel">Reading batch</text>
  <path d="M650 210 L770 210" class="flow"/>
  <text x="665" y="190" class="flowLabel">Validated readings</text>
  <path d="M1030 210 L1160 210" class="flow"/>
  <text x="1055" y="190" class="flowLabel">Create/update records</text>
  <path d="M1160 270 C1080 365 1030 455 970 500" class="flow"/>
  <text x="1040" y="390" class="flowLabel">Rules and latest data</text>
  <path d="M1030 560 L1160 560" class="flow"/>
  <text x="1055" y="540" class="flowLabel">Alert events</text>
  <path d="M1160 600 C1080 665 1010 690 930 620" class="flow"/>
  <text x="1040" y="695" class="flowLabel">Stored history</text>
  <path d="M295 780 C570 860 1030 860 1160 610" class="flow"/>
  <text x="625" y="895" class="flowLabel">Roster and rule updates</text>
  <path d="M1420 560 L1460 720" class="flow"/>
  <text x="1350" y="670" class="flowLabel">Dashboard and alerts</text>
</svg>

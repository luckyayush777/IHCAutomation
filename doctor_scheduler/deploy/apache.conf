# Add inside the institute's existing HTTPS virtual host. Requires mod_cgi or
# mod_cgid, mod_alias, mod_authz_core and mod_headers. This is not a new vhost.
ScriptAlias "/ihc/personnel.cgi" "/home/website/ihc-cgi/personnel.cgi"

<Directory "/home/website/ihc-cgi">
    AllowOverride None
    Options -Indexes
    Require all granted
</Directory>

<Directory "/home/website/html/ihc">
    AllowOverride None
    Options -Indexes
    DirectoryIndex index.html
    Require all granted
    Header always set Cache-Control "no-cache, max-age=0, must-revalidate"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
</Directory>

<Directory "/home/website/html/ihc/src">
    Require all denied
</Directory>

# Only the entry page and explicit CGI URL are publicly accessible under /ihc/.
# Blocks sources, old assets, dotfiles, temporary files and directory browsing.
<LocationMatch "^/ihc/(?!$|index[.]html$|personnel[.]cgi$)">
    Require all denied
</LocationMatch>

<Location "/ihc/personnel.cgi">
    LimitRequestBody 65536
</Location>
